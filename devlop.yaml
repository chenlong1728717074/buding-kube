apiVersion: v1
kind: Namespace
metadata:
  name: kube-buding-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: buding-system
  namespace: kube-buding-system
---
# 敏感配置: 部署前务必替换为随机字符串, 例如 openssl rand -base64 32
# JWT 密钥和 kubeconfig 加密密钥分开配置, 轮换 JWT 密钥时已保存的集群凭证不会失效
apiVersion: v1
kind: Secret
metadata:
  name: buding-kube-secret
  namespace: kube-buding-system
type: Opaque
stringData:
  JWT_SECRET_KEY: "please-change-me-jwt-secret"
  KUBE_SECRET_KEY: "please-change-me-kubeconfig-encrypt-key"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: buding-system-ns-secrets-manager
rules:
  # 启动时检查/创建自身的命名空间
  - apiGroups: [""]
    resources:
      - namespaces
      - secrets
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # 启动时注册 User / Cluster 两个 CRD
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: ["create", "get", "list", "watch", "update", "patch"]
  # 读写用户和集群数据
  - apiGroups: ["kube.buding.goaigc.fun"]
    resources:
      - clusters
      - users
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: buding-system-ns-secrets-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: buding-system-ns-secrets-manager
subjects:
  - kind: ServiceAccount
    name: buding-system
    namespace: kube-buding-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buding-kube
  namespace: kube-buding-system
  labels:
    app: buding-kube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buding-kube
  template:
    metadata:
      labels:
        app: buding-kube
    spec:
      serviceAccountName: buding-system
      containers:
      - name: buding-kube
        image: buding-kube:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        # 代码读取的是 KUBE_RUNTIME_PORT(之前写的 PORT 不会生效)
        - name: KUBE_RUNTIME_PORT
          value: "8080"
        - name: KUBE_RUNTIME_ENV
          value: "KUBE_POD"
        envFrom:
        - secretRef:
            name: buding-kube-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: buding-kube-service
  namespace: kube-buding-system
  labels:
    app: buding-kube
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: buding-kube
